name: Testes

on:
  push:
  pull_request:
  # Rodar à mão na main publica o APK assinado em servidor/public/downloads (job publicar-apk).
  # Fica no mesmo workflow para o versionCode (10100 + número da execução) só subir.
  workflow_dispatch:

jobs:
  javascript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/cripto/package-lock.json
      - name: Instalar
        working-directory: packages/cripto
        run: npm ci
      - name: Testes
        working-directory: packages/cripto
        run: npm test
      - name: Tipos
        working-directory: packages/cripto
        run: npm run typecheck
      - name: Cofre web
        working-directory: web
        run: npm ci && npm test && npm run typecheck && npm run build
      - name: Build publicado
        run: git diff --exit-code -- servidor/public/app web/BUILD-SHA256.txt
      - name: Hash do site publicado
        run: |
          {
            echo "### SHA-256 do cofre web"
            echo "Confira o site com: scripts/conferir-web.sh"
            echo "```"
            cat web/BUILD-SHA256.txt
            echo "```"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Dependências de produção
        run: |
          npm audit --omit=dev --prefix packages/cripto
          npm audit --omit=dev --prefix web

  php:
    name: PHP 8.2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: sodium, intl, mbstring
          coverage: none
      - name: Instalar
        working-directory: php
        run: composer install --no-interaction --prefer-dist
      - name: Testes
        working-directory: php
        run: composer test
      - name: Dependências
        working-directory: php
        run: composer audit --no-interaction --locked

  servidor:
    name: Servidor Laravel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: sodium, intl, mbstring, gmp, pdo_sqlite, sqlite3
          coverage: none
      - name: Instalar
        working-directory: servidor
        run: composer install --no-interaction --prefer-dist
      - name: Testes
        working-directory: servidor
        run: php artisan test --colors=never
      - name: Dependências
        working-directory: servidor
        run: composer audit --no-interaction --locked

  android:
    name: Android
    runs-on: ubuntu-latest
    env:
      TEM_LOJA: ${{ secrets.BROQUEL_KEYSTORE_B64 != '' && 'sim' || 'nao' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: libsodium
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev
      - name: SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Plataforma
        run: yes | sdkmanager --licenses >/dev/null || true
      - name: Componentes
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Testes, lint e APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew :cripto:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Dependências Android
        run: python3 scripts/auditar-gradle.py
      - name: APK de debug
        uses: actions/upload-artifact@v4
        with:
          name: broquel-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      # Com o segredo BROQUEL_KEYSTORE_B64 cadastrado, o CI gera também o APK de release assinado
      # sempre com a mesma chave. É esse que o celular consegue atualizar por cima.
      - name: APK de release assinado
        if: ${{ env.TEM_LOJA == 'sim' }}
        working-directory: android
        env:
          BROQUEL_KEYSTORE_B64: ${{ secrets.BROQUEL_KEYSTORE_B64 }}
          BROQUEL_KEYSTORE_SENHA: ${{ secrets.BROQUEL_KEYSTORE_SENHA }}
          BROQUEL_KEY_ALIAS: ${{ secrets.BROQUEL_KEY_ALIAS }}
          BROQUEL_KEY_SENHA: ${{ secrets.BROQUEL_KEY_SENHA }}
        run: |
          loja="$RUNNER_TEMP/broquel.keystore"
          printf '%s' "$BROQUEL_KEYSTORE_B64" | base64 -d > "$loja"
          BROQUEL_KEYSTORE="$loja" ./gradlew :app:assembleRelease
          rm -f "$loja"
      - name: Guardar APK de release
        if: ${{ env.TEM_LOJA == 'sim' }}
        uses: actions/upload-artifact@v4
        with:
          name: broquel-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  publicar-apk:
    name: Publicar APK na página
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    needs: [javascript, php, servidor, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Conferir o segredo da assinatura
        env:
          BROQUEL_KEYSTORE_B64: ${{ secrets.BROQUEL_KEYSTORE_B64 }}
        run: |
          if [ -z "$BROQUEL_KEYSTORE_B64" ]; then
            echo "::error::Cadastre BROQUEL_KEYSTORE_B64 e as senhas (docs/IMPLANTACAO.md). Sem a mesma chave o celular não atualiza por cima."
            exit 1
          fi
      - name: Baixar o APK assinado desta execução
        uses: actions/download-artifact@v4
        with:
          name: broquel-release
          path: ${{ runner.temp }}/release
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: SDK
        uses: android-actions/setup-android@v3
        with:
          packages: build-tools;35.0.0
      - name: Conferir assinatura e copiar
        run: |
          apk="$RUNNER_TEMP/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certificado.txt"
          mkdir -p servidor/public/downloads
          cp "$apk" servidor/public/downloads/broquel.apk
          echo "1.1.${GITHUB_RUN_NUMBER}" > servidor/public/downloads/broquel.apk.versao
          {
            echo "### APK publicado em /downloads/broquel.apk"
            echo "Versão 1.1.${GITHUB_RUN_NUMBER}"
            echo '```'
            (cd servidor/public/downloads && sha256sum broquel.apk)
            grep -i "SHA-256" "$RUNNER_TEMP/certificado.txt" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit na main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add servidor/public/downloads/broquel.apk servidor/public/downloads/broquel.apk.versao
          git commit -m "Publica o APK 1.1.${GITHUB_RUN_NUMBER} na página de downloads."
          for tentativa in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
