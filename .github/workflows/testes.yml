name: Testes

on:
  push:
  pull_request:

jobs:
  javascript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/cripto/package-lock.json
      - name: Instalar
        working-directory: packages/cripto
        run: npm ci
      - name: Testes
        working-directory: packages/cripto
        run: npm test
      - name: Tipos
        working-directory: packages/cripto
        run: npm run typecheck

  php:
    name: PHP 8.2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: sodium, intl, mbstring
          coverage: none
      - name: Instalar
        working-directory: php
        run: composer install --no-interaction --prefer-dist
      - name: Testes
        working-directory: php
        run: composer test

  servidor:
    name: Servidor Laravel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: sodium, intl, mbstring, gmp, pdo_sqlite, sqlite3
          coverage: none
      - name: Instalar
        working-directory: servidor
        run: composer install --no-interaction --prefer-dist
      - name: Testes
        working-directory: servidor
        run: php artisan test --colors=never

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: libsodium
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev
      - name: SDK
        uses: android-actions/setup-android@v3
      - name: Plataforma
        run: yes | sdkmanager --licenses >/dev/null || true
      - name: Componentes
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Testes e APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew :cripto:test :app:testDebugUnitTest :app:assembleDebug
      - name: APK de debug
        uses: actions/upload-artifact@v4
        with:
          name: broquel-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
